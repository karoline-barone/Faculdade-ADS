<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo15 - Javascript</title>
</head>
<body>
    <script type="text/Javascript">
        var num = parseInt(prompt("Entre com um número para contagem progressiva"));
        for(var x = 0; x <= num; x++) {
            document.write(x+"<br>"); 
        }
    </script>
</html>
