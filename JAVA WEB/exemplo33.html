<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo IMC</title>
</head>
<!--estilo-->
<style>
    .conteudo{
        width: 400px;
        border:solid 1px blue;
    }
    label{
        width: 150px;
        display:inline-block;
        text-align: right;
        margin-right: 10px;
    }
</style>
<body>
    <div class="conteudo">
        <h1>CALCULANDO O IMC</h1>
        <label>Digite a sua altura:</label>
        <input type="text" name="altura"><br>
        <label>Digite o seu peso:</label>
        <input type="text" name="peso"><br>
        <p id="total"></p>
        <br>
        <p id="mensagem"></p>
        <center><button onclick="calcular()">CALCULAR</button></center>
    </div>
    <script type="text/javascript">
        function calcular(){
            var altura=document.getElementsByName("altura");
            var peso=document.getElementsByName("peso");
            var imc=(parseFloat(peso[0].value)/parseFloat(altura[0].value)/parseFloat(altura[0].value));
            document.getElementById("total").innerHTML=imc.toFixed(2);
            //escreve no html no paragrafo total o imc com duas casas decimais
            var mensagem;
            if(imc<=18)mensagem="Abaixo do peso";
            else if(imc<=25)mensagem="Peso normal";
            else if(imc<=30)mensagem="Excesso de peso";
            else mensagem="Obesidade";
            document.getElementById("mensagem").innerHTML=mensagem;
        }
    </script>
</body>
</html>
