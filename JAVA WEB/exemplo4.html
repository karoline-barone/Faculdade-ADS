<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo4 - Javascript</title>
</head>
<body>
    <script type="text/Javascript">
        var a = parseInt(prompt("Digite o primeiro valor: ")); //prompt entrada de texto
        var b = parseInt(prompt("Digite o segundo valor: "));
        //parse converter a entrada, parseInt(inteiro), parsefloat(ponto flutuante)
        var soma = a + b;
        var diferenca = a - b;
        var produto = a * b;
        var media = (a + b) / 2;
        alert("A soma="+soma+",a diferenca="+diferenca);
        alert("O produto="+produto+"e a media="+media);
    </script>
</body>
</html>
