<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passagem por valor</title>
</head>
<body>
    <script type="text/javascript">
        function compara(a,b){
            if (a > b){
                alert("O maior = "+a);
            } else if(a ==b){
                alert("São iguais");
            }else{
                alert("O maior = "+b);
            }
        }
        var x = 5;
        var y = 2;
        compara(x,y);
    </script>
</body>
</html>
