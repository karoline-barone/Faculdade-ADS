<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo10 - Javascript</title>
</head>
<body>
    <script type="text/Javascript">
        var opcao = parseInt(prompt("Escolha a opção 1-Abrir 2-Consultar 3-Sair"));
        switch(opcao){
            case 1:document.write("Você escolheu a opção 1");
            break;
            case 2:document.write("Você escolheu a opção 2");
            break;
            case 3:document.write("Você escolheu a opção 3");
            break;
            default:alert("Opção inválida!");
        }
    </script>
</body>
</html>
