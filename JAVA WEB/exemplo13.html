<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo13 - Javascript</title>
</head>
<body>
    <script type="text/Javascript">
        var fruta = prompt("Digite a fruta de sua preferência");
        switch(fruta){
            case 'morango':alert("Ótima escolha");
                break;
            case "laranja":alert("O suco é bom");
                break;
            case 'açaí':alert("Tem gosto de terra");
                break;
            default:alert("Fruta fora do cardápio");
        }
    </script>
</body>
</html>
