<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo12 - Javascript</title>
</head>
<body>
    <h1>Categoria de nadadores</h1>
    <script type="text/Javascript">
        var idade = parseInt(prompt("Digite a idade do atleta: "))
        if (idade < 7){
            document.write("Infantil");
        }else if(idade < 11){
            document.write("Juvenil A");
        }else if(idade <18){
            document.write("Juvenil B");
        }else{
            document.write("Adulto");
        }
    </script>
</body>
</html>
