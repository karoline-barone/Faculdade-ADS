<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função simples</title>
</head>
<body>
    <script type="text/javascript">
        function mensagem(){ //função simples - aquela que você identifica
            alert("Função declarativa");
        }
        mensagem(); //chamando pela função
    </script>
</body>
</html>
