<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções nativas</title>
</head>
<body>
    <script type="text/javascript">
        var seuNome;
        seuNome = prompt("Digite seu primeiro nome: ");
        for (var x = 0; x < seuNome.length; x++) //length tamanho em caracteres
            document.write(seuNome[x]+"<br>"); //mostra letra por letra
    </script>
</body>
</html>
