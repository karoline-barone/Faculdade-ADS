<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo ParseInt</title>
</head>
<body>
    <script type="text/javascript">
        var num1 = parseInt("5")+"<br>"; // 5
        var num2 = parseInt("5.00")+"<br>"; // 5
        var num3 = parseInt("5.11")+"<br>"; // 5
        var num4 = parseInt("14 25 11")+"<br>"; // 14
        var num5 = parseInt(" 20 ")+"<br>"; // 20 ignorou espaços
        var num6 = parseInt("25 anos")+"<br>"; // 25
        var num7 = parseInt("5",5)+"<br>"; // NaN = not a number
        var num8 = parseInt("050")+"<br>"; // 50
        var num9 = parseInt("0x50")+"<br>"; // 80 hexadecimal
        var num10 = parseInt("tenho 25 anos"); // NaN
        var resultado = num1+num2+num3+num4+num5+num6+num7+num8+num9+num10;
        document.write(resultado);
    </script>
</body>
</html>
