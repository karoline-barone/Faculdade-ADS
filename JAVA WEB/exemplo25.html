<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura (struct)</title>
</head>
<body>
    <script type="text/javascript">
        var quemSou={
            nome:"Paulo",
            sobrenome:"Macedo",
            idade:"55",
            hobby:"Futebol"
        }
        for(var ficha in quemSou){
            document.write(ficha+" = "+quemSou[ficha]+"<br>");
        }
    </script>
</body>
</html>
