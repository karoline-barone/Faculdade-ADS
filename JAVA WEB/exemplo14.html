<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 14 - Javascript</title>
</head>
<body>
    <script type="text/Javascript">
        var num = parseInt(prompt("Entre com um número para contagem regressiva"));
        for(var x = num; x > 0; x--) //recebeu o número, vai fazer até o 0, diminuindo 1
            document.write(x+"<br>") //se for fazer somente um comando, não precisa de chave
    </script>
</body>
</html>
