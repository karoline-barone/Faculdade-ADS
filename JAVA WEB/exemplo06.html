<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo6 - Javascript</title>
</head>
<body>
    <script type="text/Javascript">
        var nome = prompt("Digite seu nome: ");
        var anoatual = parseInt(prompt("Digite o ano atual: "));
        var anonasc = parseInt(prompt("Digite o ano de seu nascimento: "));
        var idade = anoatual - anonasc;
        document.write("Olá "+nome+"<br>Você tem aproximadamente: "+idade+"anos");
    </script>
</body>
</html>
