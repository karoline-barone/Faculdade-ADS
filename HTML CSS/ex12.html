<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de tabelas</title>
</head>
<body>
    <table border="1"> <!--criar tabela com borda-->
        <caption>Tabela de preços</caption> <!--rótulo tabela-->
        <tr><th>Produtos</th><th>R$</th></tr> 
        <!--tr= table row =linha / th = table header =cabeçalho-->
        <tr><td>Arroz</td><td>R$21,00</td></tr> <!--td = table data = coluna-->
        <tr><td>Feijão</td><td>R$7,00</td></tr>
        <tr><td>Açucar</td><td>R$4,00</td></tr>
        <tr><td>Macarrão</td><td>R$3,50</td></tr>

    </table>
</body>
</html>
