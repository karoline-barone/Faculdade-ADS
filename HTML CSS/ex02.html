<!DOCTYPE html> <!-- versão do documento -->
<html lang="pt"> <!-- delimita a página -->
<head>
    <meta charset="UTF-8"> <!-- exibir acentuação e cedilha corretamente-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- para ajustar ao device (dispositivo) que foi aberto-->
    <title>Exemplo2</title> <!-- título da aba do navegador -->
</head>
<body bgcolor ="yellow" text = #800080> <!--background color e text color, #FF0000 hexadecimal-->
    <center><h1> Bem vindo ao meu website </h1></center>
    <hr> <!-- horizontal rule = faz uma linha horizontal-->
    <br> <!-- break = pula linha-->
    <p> Colocar parágrafo </p>
    <br>
    <b> Coloca texto em negrito </b> <!-- bold -->
    <br>
    <i> Coloca texto em itálico </i> <!-- italic -->
    <br>
    <s> Coloca texto em atachado </s>
    <br>
    <strong> Reforça o texto </strong>
    <br>
    <pre> Texto pré formatado </pre>
    <br>
    <u> Texto sublinhado </u> <!--underline-->
    <br>
    <p> Fórmula da água H<sub>2</sub>O </p> <!-- subscrito -->
    <p> A FATEC tem 1500m<sup>2</sup></p> <!-- sobrescrito -->
</body>
</html>
