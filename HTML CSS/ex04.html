<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiperlink com imagem</title>
</head>
<body background = "marca.png"> <!--imagem de fundo-->
    <h1>Hiperlinks com imagem</h1>
    <a href = "https://www.google.com">
        <img src = "google.png" width = "128px" height = "128px"> <!-- largura e altura da imagem, px = pixel-->
    </a>
    <a href = "https://www.uol.com.br">
        <img src = "uol.png" width = "128px" height = "128px">
    </a>
    <a href = "https://www.r7.com">
        <img src = "r7.png" width = "128px" height = "128px">
    </a>
    <hr>
    <marquee scrollamount = "20"> Boa noite! </marquee> <!-- texto animado, passa de um lado para outro, scrollamount = velocidade -->
    
</body>
</html>
