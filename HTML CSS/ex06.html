<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo06 - Listas</title>
</head>
<body>
    <!--Lista ordenada = ol = order list-->
    <ol type="a" start="f"> <!--types = a, A, i, I / start coloca onde quer começar-->
        <li> item um </li> <!-- li = list item = coloca um item na lista-->
        <li> item dois </li>
        <li> item três </li>
    </ol>
    <!-- lista não ordenada = ul -->
     <ul type="circle"> <!--types: disc, square, circle-->
        <li>Pera</li>
        <li>Uva</li>
        <li>Maça</li>
        <li>Salada Mista</li>
     </ul>
     <!-- lista de definição = dl = definition list-->
      <dl>
        <dt>HTML</dt> <!-- dt = definition term -->
        <dd>Linguagem de marcação de texto</dd> <!-- dd = definition description -->
        <dt>TESTE</dt>
        <dd>Definição teste</dd>
      </dl>
</body>
</html>
