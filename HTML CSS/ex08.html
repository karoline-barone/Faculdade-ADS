<html>
<head>
    <title>Exemplo 7 - Frames</title>
</head>
<!-- frame divide a tela em linhas ou colunas-->
<frameset rows="10%, 20%,*"> <!--* representa o restante, nesse caso 70%. rows = linhas-->
    <frame src="frame1.html" noresize> <!--usuário não consegue alterar-->
    <frame src="frame2.html">
    <frame src="frame3.html">
</frameset>
</html>
