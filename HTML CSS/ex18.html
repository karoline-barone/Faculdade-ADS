<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario na tabela</title>
</head>
<body>
    <form>
        <h1>Formulário na Tabela</h1>
        <table border="1" bordercolor="blue">
            <tr> <!-- linha -->
                <td bgcolor="lightgrey"><label>Nome:</label></td>
                <td><input type="text" size="30"></td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><label>Endereço:</label></td>
                <td><input type="text" size="50"></td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Telefone:</lable></td>
                <td><input type="tel" size="25"></td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>E-mail:</lable></td>
                <td><input type="email" size="50"></td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Data Nasc:</lable></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Sexo:</lable></td>
                <td><input type="radio" name="sexo">Feminino
                <input type="radio" name="sexo">Masculino
                <input type="radio" name="sexo">Prefiro não informar</td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Cliente:</lable></td>
                <td><input type="checkbox">Comum
                <input type="checkbox">Especial</td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Foto:</lable></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Grau:</lable></td>
                <td><input type="range">Muito Feliz</td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Cor:</lable></td>
                <td><input type="color">Cor Preferida</td>
            </tr>
            <tr>
                <td bgcolor="lightgrey"><lable>Aura:</lable></td>
                <td><input type="button" value="67">Clique para farmar</td>
            </tr>
            <tr>
                <td bgcolor="yellow"><lable>Concluir</lable></td>
                <td><input type="reset" value="limpar">
                <input type="submit" value="gravar"></td>
            </tr>
        </table>
    </form>
</body>
</html>
