<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela com imagens</title>
</head>
<body>
    <table border="1" align="center">
        <caption>Tabela de preços</caption>
        <tr bgcolor="lightgrey"><th>Produtos</th><th>R$</th></tr>
        <tr>
            <td><img src="arroz.jpg"><p align="center">Arroz</p></td>
            <td><font size="6">21,00</font></td>
        </tr>
        <tr>
            <td><img src="feijao.jpg"><p align="center">Feijão</p></td>
            <td><font size="6">7,00</font></td>
        </tr>
        <tr>
            <td><img src="acucar.jpg"><p align="center">Açucar</p></td>
            <td><font size="6">4,00</font></td>
        </tr>
        <tr>
            <td><img src="macarrao.jpg"><p align="center">Macarrão</p></td>
            <td><font size="6">3,50</font></td>
        </tr>
    </table>
</body>
</html>
